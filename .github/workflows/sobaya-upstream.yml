name: sobaya-upstream
# 팀이 고정한 sobaya 버전(harness/sobaya.lock)보다 upstream 이 앞서면 이슈를 연다. 주 1회 + 수동.
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  check:
    runs-on: poem-public
    steps:
      - name: gh CLI 준비 (self-hosted 이미지에는 없음)
        run: |
          command -v gh >/dev/null && exit 0
          v=2.103.3 a=$(dpkg --print-architecture)
          curl -fsSL "https://github.com/cli/cli/releases/download/v$v/gh_${v}_linux_$a.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${v}_linux_$a/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: lock vs upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -f harness/sobaya.lock ]; then echo "lock 없음 — sobaya 미결합"; exit 0; fi
          lock=$(sed -n 's/^sha=//p' harness/sobaya.lock)
          up=$(git ls-remote -q https://github.com/team-poem/sobaya.git HEAD | cut -f1)
          if [ -z "$up" ]; then echo "upstream 조회 실패"; exit 0; fi
          title="sobaya 업데이트 있음"
          n=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number // empty')
          if [ "$lock" = "$up" ]; then
            echo "최신 (${lock:0:7})"
            if [ -n "$n" ]; then gh issue close "$n" -c "lock 이 upstream 과 같아졌습니다."; fi
            exit 0
          fi
          printf '팀 lock: `%s` · upstream: `%s`\n\n`harness/sobaya/RULES.md`에 따라 후보 변경을 검토하고, 검증한 소스 경로·pin·관리 훅을 함께 갱신하세요. 기존 설치에는 legacy attach/sync/update를 다시 실행하지 마세요. 보관한 기능 문서와 실행 기록을 보존하고 전체 테스트 결과를 bump PR에 기록하세요.\n\n변경 내용: https://github.com/team-poem/sobaya/compare/%s...%s\n' \
            "${lock:0:7}" "${up:0:7}" "${lock:0:7}" "${up:0:7}" > body.md
          if [ -n "$n" ]; then gh issue edit "$n" --body-file body.md; else gh issue create --title "$title" --body-file body.md; fi
          echo "이슈 갱신 (${lock:0:7} → ${up:0:7})"
