<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><style>
    @font-face {
      font-family: Pretendard;
      src: url('../../../../public/fonts/PretendardVariable.woff2');
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      font-family: Pretendard, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      padding: 64px 72px;
      border-top: 12px solid #f51636;
    }
    .logo {
      width: 160px;
      height: 60px;
      object-fit: contain;
      object-position: left;
    }
    .title {
      font-size: 88px;
      font-weight: 850;
      letter-spacing: -4px;
      line-height: 1.15;
      margin: 32px 0 22px;
    }
    .subtitle {
      font-size: 27px;
      color: #64748b;
    }
    .domain {
      position: absolute;
      bottom: 45px;
      left: 72px;
      font-size: 21px;
      color: #64748b;
      letter-spacing: 1px;
    }
    .art {
      position: absolute;
      width: 370px;
      height: 370px;
      border-radius: 50%;
      background: #fff0f3;
      right: 45px;
      top: 128px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #ffe0e6;
    }
    .pin {
      width: 128px;
      height: 128px;
      border: 12px solid #f51636;
      border-radius: 65% 65% 65% 12%;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    .pin:after {
      content: '';
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #f51636;
    }
    .ring {
      position: absolute;
      inset: 32px;
      border: 1px solid #ffc7d1;
      border-radius: 50%;
    }
    .label {
      position: absolute;
      right: 107px;
      bottom: 60px;
      color: #f51636;
      font-size: 20px;
      font-weight: 650;
      background: white;
      padding: 12px 24px;
      border-radius: 28px;
    }
  </style>
  <div class="card">
    <img
      class="logo"
      alt="흉흉"
      src="../../../../public/brand/hyunghyung.svg"
    />
    <h1 class="title">내 주변의<br />사건 사고</h1>
    <p class="subtitle">기사로 살펴보는 우리 동네</p>
    <div class="domain">hyunghyung.vercel.app</div>
    <div class="art">
      <div class="ring"></div>
      <div class="pin"></div>
    </div>
    <div class="label">지도에서 기사 찾기</div>
  </div>
</html>
